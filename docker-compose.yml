# Gateway in front of a local vLLM server (needs an NVIDIA GPU + nvidia-container-toolkit).
# Without a GPU, point UPSTREAM_URL at any OpenAI-compatible API instead and drop the vllm service.
services:
  vllm:
    image: vllm/vllm-openai:latest
    command: ["--model", "Qwen/Qwen2.5-0.5B-Instruct", "--max-model-len", "4096"]
    ports: ["8000:8000"]
    volumes: ["hf-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  gateway:
    build: .
    environment:
      UPSTREAM_URL: http://vllm:8000/v1
    ports: ["8080:8080"]
    depends_on: [vllm]

volumes:
  hf-cache:
